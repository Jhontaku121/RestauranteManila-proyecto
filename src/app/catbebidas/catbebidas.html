<section class="bg3 p-1 ms-2 me-2">
    <div class="row m-auto">
        <div class="d-flex col-3 align-items-center justify-content-end">
            <label class="text-white me-1">Buscar Por:</label>
        </div>
        <div class="col-2">
            <select class="form-select" [(ngModel)]="filtro0">
                <option>Nombre</option>
                <option>Ingrediente</option>
            </select>
        </div>
        <div class="col-5">
            <input class="form-control" placeholder="Buscar" name="buscar" [(ngModel)]="buscador">
        </div>
        <div class="d-flex col-1 justify-content-center mx-auto">
            <button (click)="buscar()" class="btn btn-light bg1">Buscar</button>
        </div>
    </div>
    <div class="d-flex row justify-content-center mt-1">
        <div class="d-flex col-1 align-items-center">
            <label class="text-white">Filtrar por:</label>
        </div>
        <div class="col-2">
            <select class="form-select" [(ngModel)]="filtro1">
                <option>Con Alcohol</option>
                <option>sin Alcohol</option>
            </select>
        </div>
        <div class="col-2 text-center">
            <button (click)="filtroalcohol()" class="btn btn-light bg1">Buscar</button>
        </div>
        <div class="col-2">
            <select class="form-select" [(ngModel)]="filtro2">
                @for (item of categoria; track $index) {
                    <option>{{item.strCategory}}</option>
                }
            </select>
        </div>
        <div class="col-2">
            <button (click)="filtrocategorias()" class="btn btn-light bg1">Buscar cat</button>
        </div>
    </div>
</section>
<section class="mt-4 mb-5 ms-4 me-4">
    <div class="row">
        @for (item of ebebidas; track $index) {
        <div class="card col-3 mb-4" id="btn-{{item.id}}">
            <img [src]="item.foto" class="card-img-top mt-3 proc" alt="{{ item.nombre }}">
            <div class="card-body">
                <h3 class="card-title text-center">{{ item.nombre }}</h3>
                <h4 class="text-center">$ {{item.precio}}</h4>
            </div>
            <div class="d-flex align-items-end justify-content-evenly mb-3">
                <a (click)="detalles(item)" class=" btn btn-secondary bg1 mt-3 align-items-end">Detalles</a>
                <a (click)="addcarro(item)" class=" btn bg3 btn-dark mt-3 align-items-end">➕🛒</a>
            </div>
        </div>
        }
    </div>
</section>
@if(mostrarSection){
    <section class="bg3 text-center">
        <h2 class="text-white">Sin resultados</h2>
    </section>
}
<!-- The Modal -->
<div class="modal" id="myModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <!-- Modal Header -->
      <div class="modal-header">
        <h4 class="modal-title">{{titulo}}</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Modal body -->
      <div class="modal-body">
        <p><strong>Ingredientes:</strong></p>
        <div class="d-flex flex-wrap gap-2">
            @if(selectedItem){
                @for (ing of getIngredientes(selectedItem); track $index) {
                    <span class="badge bg-secondary">{{ ing }}</span>
                }
            }
        </div>
      </div>

      <!-- Modal footer -->
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
      </div>

    </div>
  </div>
</div>
