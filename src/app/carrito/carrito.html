<h1 class="text-center bg3 text-white">Carrito</h1>
<section class="container text-start bg2">
    <h2>Comidas:</h2>
    @for(item of infoc; track $index){
    <div class="d-flex mb-3 align-items-center justify-content-center text-center">
        <div class="col-ms-2">
            <img src="{{item.foto}}">
        </div>
        <div class="col-ms-2">
            <h3 class="me-4 ms-2">Nombre: {{item.nombre}}</h3>
        </div>
        <div class="col-ms-2">
            <h3 class="me-4 ms-2">Precio: {{item.precio}}</h3>
        </div>
        <div class="col-ms-2">
            <h3>catidad: {{item.cant}}</h3>
        </div>
    </div>
    }
    <h2>Bebidas:</h2>
    @for(item of infob; track $index){
    <div class="d-flex mb-3 align-items-center justify-content-center text-center">
        <div class="col-ms-2">
            <img src="{{item.foto}}">
        </div>
        <div class="col-ms-2">
            <h3 class="me-4 ms-2">Nombre: {{item.nombre}}</h3>
        </div>
        <div class="col-ms-2">
            <h3 class="me-4 ms-2">Precio: {{item.precio}}</h3>
        </div>
        <div class="col-ms-2">
            <h3>catidad: {{item.cant}}</h3>
        </div>
    </div>
    }
</section>
